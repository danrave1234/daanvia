plugins { id 'com.android.application' }
android {
    namespace 'net.drave.atrdiagnostics'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'net.drave.atrdiagnostics'; minSdk 29; targetSdk 35; versionCode 8; versionName '0.5.0' }
    signingConfigs { prototype { storeFile file('../signing/prototype.p12'); storePassword 'atr-local-test'; keyAlias 'atr'; keyPassword 'atr-local-test' } }
    // Release is signed with the same public prototype TEST key so it installs over earlier test builds. Not a production key.
    buildTypes { debug { signingConfig signingConfigs.prototype }; release { signingConfig signingConfigs.prototype; minifyEnabled false } }
    // One APK per CPU type: phones get the smaller arm64 APK; x86_64 is for emulators.
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    // Map data is downloaded per area; the Cebu files in assets/cebu stay in the repo as build input only.
    androidResources { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!cebu' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'io.github.rallista:valhalla-mobile:0.6.4'
}
