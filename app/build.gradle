plugins { id 'com.android.application' }
def releaseKey = new File(System.getProperty('user.home'), '.daanvia/signing.properties')
def releaseProps = new Properties(); if (releaseKey.isFile()) releaseKey.withInputStream { releaseProps.load(it) }
gradle.taskGraph.whenReady { graph ->
    if (!releaseKey.isFile() && graph.allTasks.any { it.name ==~ /(package|assemble|bundle)Release/ })
        throw new GradleException("Release signing key missing: " + releaseKey + ". Releases must be signed with Daanvia's private key.")
}
android {
    namespace 'net.drave.atrdiagnostics'
    compileSdk 36
    buildToolsVersion "35.0.0"
    // From 0.9.0 the app id is net.drave.daanvia and releases are signed with a private key kept off GitHub; the old id
    // (net.drave.atrdiagnostics, signed with the public test key) hands its data over to it (MoveActivity).
    defaultConfig { applicationId 'net.drave.daanvia'; minSdk 29; targetSdk 35; versionCode 43; versionName '0.9.3'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    // Debug builds use the public test key. Releases use the private key named in ~/.daanvia/signing.properties (storeFile,
    // storePassword, keyAlias, keyPassword), which never goes into this repository; without it a release build stops.
    signingConfigs {
        prototype { storeFile file('../signing/prototype.p12'); storePassword 'atr-local-test'; keyAlias 'atr'; keyPassword 'atr-local-test' }
        if (releaseKey.isFile()) release { storeFile file(releaseProps.storeFile); storePassword releaseProps.storePassword; keyAlias releaseProps.keyAlias; keyPassword releaseProps.keyPassword }
    }
    buildTypes { debug { signingConfig signingConfigs.prototype; ndk { abiFilters 'x86_64' } }; release { if (releaseKey.isFile()) signingConfig signingConfigs.release; minifyEnabled false } }
    // One APK for every Android phone (64-bit and 32-bit ARM). Only debug builds add x86_64, for testing on a PC emulator.
    // Compress the native libraries inside the APK so the one-for-all download stays small; Android unpacks them on install.
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    // QR scanner: CameraX for focus and zoom, ML Kit (bundled, works offline without Google services) to read the code.
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'io.github.rallista:valhalla-mobile:0.6.4'
}
