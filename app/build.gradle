plugins { id 'com.android.application' }
android {
    namespace 'net.drave.atrdiagnostics'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'net.drave.atrdiagnostics'; minSdk 29; targetSdk 35; versionCode 11; versionName '0.5.3'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    signingConfigs { prototype { storeFile file('../signing/prototype.p12'); storePassword 'atr-local-test'; keyAlias 'atr'; keyPassword 'atr-local-test' } }
    // Release is signed with the same public prototype TEST key so it installs over earlier test builds. Not a production key.
    buildTypes { debug { signingConfig signingConfigs.prototype; ndk { abiFilters 'x86_64' } }; release { signingConfig signingConfigs.prototype; minifyEnabled false } }
    // One APK for every Android phone (64-bit and 32-bit ARM). Only debug builds add x86_64, for testing on a PC emulator.
    // Compress the native libraries inside the APK so the one-for-all download stays small; Android unpacks them on install.
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'io.github.rallista:valhalla-mobile:0.6.4'
}
