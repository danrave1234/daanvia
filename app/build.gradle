plugins { id 'com.android.application' }
android {
    namespace 'net.drave.atrdiagnostics'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'net.drave.atrdiagnostics'; minSdk 29; targetSdk 35; versionCode 7; versionName '0.5.0-alpha1'; ndk { abiFilters 'arm64-v8a', 'x86_64' } }
    signingConfigs { prototype { storeFile file('../signing/prototype.p12'); storePassword 'atr-local-test'; keyAlias 'atr'; keyPassword 'atr-local-test' } }
    buildTypes { debug { signingConfig signingConfigs.prototype } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'io.github.rallista:valhalla-mobile:0.6.4'
}
